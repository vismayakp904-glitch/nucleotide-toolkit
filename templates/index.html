<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nucleotide Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>Nucleotide Toolkit</h1>
        <p>DNA and RNA sequence tools</p>
      </div>
      <nav id="nav" aria-label="Tools"></nav>
    </aside>

    <main class="main">
      <div class="hero"><canvas id="hero" aria-hidden="true"></canvas></div>

      <section class="panel">
        <h2 id="title"></h2>
        <p id="description" class="lead"></p>
        <div id="fields"></div>
        <div class="actions">
          <button id="run" class="primary">Run</button>
          <button id="example" class="secondary" type="button">Fill example</button>
          <button id="clear" class="secondary" type="button">Clear</button>
        </div>

        <div id="visualWrap" hidden>
          <h3>Visualisation</h3>
          <div id="visual" class="visual" aria-live="polite"></div>
        </div>

        <h3>Result</h3>
        <pre id="output" class="output empty" aria-live="polite">Your result will appear here.</pre>
      </section>
      <footer>Each tool runs the original Python script for that module. The visuals are drawn from what the script prints.</footer>
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
